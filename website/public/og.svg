<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>prr — Good code deserves a second look.</title>
  <desc>A terminal review and an annotated finding, in prr's dark slate and amber colors.</desc>
  <rect width="1200" height="630" fill="#1a1d29"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fefdfb">
    <g transform="translate(62 48)"><rect width="40" height="40" rx="12" fill="#f59e0b"/><g fill="none" stroke="#1a1d29" stroke-width="2.4" stroke-linecap="round"><path d="M12 12v16m0-9h7a8 8 0 0 0 8-8M21 24l3 3 5-6"/><circle cx="12" cy="11" r="3" fill="#f59e0b"/><circle cx="12" cy="29" r="3" fill="#f59e0b"/></g></g>
    <text x="116" y="79" font-size="30" font-weight="600" letter-spacing="-1">smeltery<tspan fill="#aeb7c7" font-weight="400"> / prr</tspan></text>
    <text x="1138" y="76" text-anchor="end" font-size="14" fill="#aeb7c7">A second look. A better change.</text>
    <text x="62" y="220" font-size="62" font-weight="600" letter-spacing="-3">Good code</text>
    <text x="62" y="291" font-size="62" font-weight="600" letter-spacing="-3">deserves a</text>
    <text x="60" y="371" font-family="Georgia, serif" font-style="italic" font-size="76" letter-spacing="-3" fill="#f59e0b">second look.</text>
    <text x="64" y="429" font-size="19" fill="#aeb7c7">Your agents. Your workflow. One command.</text>
    <rect x="62" y="469" width="196" height="46" rx="23" fill="#f59e0b"/>
    <text x="160" y="498" text-anchor="middle" font-size="15" fill="#1a1d29">Meet your next reviewer</text>
    <rect x="610" y="160" width="528" height="339" rx="18" fill="#232836" stroke="#343d50"/>
    <rect x="635" y="188" width="478" height="193" rx="10" fill="#171b24"/>
    <g fill="#f59e0b"><circle cx="653" cy="207" r="3"/><circle cx="665" cy="207" r="3"/><circle cx="677" cy="207" r="3"/></g>
    <text x="1093" y="211" text-anchor="end" font-family="monospace" font-size="10" fill="#aeb7c7">~/projects/your-next-idea</text>
    <path d="M635 224h478" stroke="#343d50"/>
    <g font-family="monospace" font-size="14"><text x="657" y="259"><tspan fill="#f59e0b">❯ </tspan>prr 128 --focus security</text><text x="657" y="292" fill="#aeb7c7">Reading diff and codebase context…</text><text x="657" y="325" fill="#fbbf24">✓ Review complete</text><text x="657" y="355" font-size="12" fill="#aeb7c7">1 critical · 2 suggestions · 1 praise</text></g>
    <rect x="666" y="370" width="447" height="153" rx="10" fill="#2d3748" stroke="#475569"/>
    <rect x="684" y="388" width="54" height="20" rx="4" fill="#523927"/>
    <text x="711" y="402" text-anchor="middle" font-size="10" fill="#ffd29c">Critical</text><text x="751" y="402" font-size="10" font-family="monospace" fill="#aeb7c7">auth/session.go : 42</text>
    <text x="684" y="437" font-size="16" font-weight="600">Check the expiry before refreshing.</text><text x="684" y="463" font-size="12" fill="#bdc8d8">Validate ExpiresAt before issuing a new token.</text><path d="M684 478h409" stroke="#475569"/><text x="684" y="501" font-size="10" fill="#fbbf24">✓ Verified against the diff</text><text x="1094" y="501" text-anchor="end" font-size="9" fill="#aeb7c7">Illustrative output</text>
    <path d="M62 567h1076" stroke="#343d50"/><text x="62" y="599" font-size="12" fill="#aeb7c7">AI code review for GitHub pull requests and local branches.</text><text x="1138" y="599" text-anchor="end" font-size="12" fill="#aeb7c7">github.com/smeltery/prr</text>
  </g>
</svg>
