<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>prr — Good code deserves a second look.</title>
  <desc>A terminal review and an annotated finding, in prr's charcoal and celadon colors.</desc>
  <rect width="1200" height="630" fill="#171c1a"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f3f1e8">
    <g transform="translate(62 48)"><rect width="40" height="40" rx="8" fill="#b8d9a2"/><g fill="none" stroke="#171c1a" stroke-width="2.8"><path d="M12 15v10m16-10v2a6 6 0 0 1-6 6h-4a6 6 0 0 0-6 6"/><circle cx="12" cy="11" r="4" fill="#b8d9a2"/><circle cx="12" cy="29" r="4" fill="#b8d9a2"/><circle cx="28" cy="11" r="4" fill="#b8d9a2"/></g></g>
    <text x="116" y="79" font-size="30" font-weight="600" letter-spacing="-1">smeltery<tspan fill="#aab7ac" font-weight="400"> / prr</tspan></text>
    <text x="1138" y="76" text-anchor="end" font-size="14" fill="#aab7ac">A second look. A better change.</text>
    <text x="62" y="220" font-size="62" font-weight="600" letter-spacing="-3">Good code</text>
    <text x="62" y="291" font-size="62" font-weight="600" letter-spacing="-3">deserves a</text>
    <text x="60" y="371" font-family="Georgia, serif" font-style="italic" font-size="76" letter-spacing="-3" fill="#b8d9a2">second look.</text>
    <text x="64" y="429" font-size="19" fill="#aab7ac">Your agents. Your workflow. One command.</text>
    <rect x="62" y="469" width="196" height="46" rx="23" fill="#b8d9a2"/>
    <text x="160" y="498" text-anchor="middle" font-size="15" fill="#171c1a">Meet your next reviewer</text>
    <rect x="610" y="160" width="528" height="339" rx="18" fill="#202823" stroke="#36453b"/>
    <rect x="635" y="188" width="478" height="193" rx="10" fill="#111613"/>
    <g fill="#b8d9a2"><circle cx="653" cy="207" r="3"/><circle cx="665" cy="207" r="3"/><circle cx="677" cy="207" r="3"/></g>
    <text x="1093" y="211" text-anchor="end" font-family="monospace" font-size="10" fill="#aab7ac">~/projects/your-next-idea</text>
    <path d="M635 224h478" stroke="#36453b"/>
    <g font-family="monospace" font-size="14"><text x="657" y="259"><tspan fill="#b8d9a2">❯ </tspan>prr 128 --focus security</text><text x="657" y="292" fill="#aab7ac">Reading diff and codebase context…</text><text x="657" y="325" fill="#d0e8bf">✓ Review complete</text><text x="657" y="355" font-size="12" fill="#aab7ac">1 critical · 2 suggestions · 1 praise</text></g>
    <rect x="666" y="370" width="447" height="153" rx="10" fill="#2a352f" stroke="#46594c"/>
    <rect x="684" y="388" width="54" height="20" rx="4" fill="#523927"/>
    <text x="711" y="402" text-anchor="middle" font-size="10" fill="#ffd29c">Critical</text><text x="751" y="402" font-size="10" font-family="monospace" fill="#aab7ac">auth/session.go : 42</text>
    <text x="684" y="437" font-size="16" font-weight="600">Check the expiry before refreshing.</text><text x="684" y="463" font-size="12" fill="#bcc9bf">Validate ExpiresAt before issuing a new token.</text><path d="M684 478h409" stroke="#46594c"/><text x="684" y="501" font-size="10" fill="#d0e8bf">✓ Verified against the diff</text><text x="1094" y="501" text-anchor="end" font-size="9" fill="#aab7ac">Illustrative output</text>
    <path d="M62 567h1076" stroke="#36453b"/><text x="62" y="599" font-size="12" fill="#aab7ac">AI code review for GitHub pull requests and local branches.</text><text x="1138" y="599" text-anchor="end" font-size="12" fill="#aab7ac">github.com/smeltery/prr</text>
  </g>
</svg>
